<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEL Ωmega Particles</title>
  <meta name="description" content="100K+ WebGPU particles with Canvas2D fallback.">
<link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #03050A; color: #E6EEF8; font-family: system-ui, -apple-system, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; }
    .status { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 100; font-family: monospace; font-size: 0.6rem; color: rgba(230,238,248,0.25); background: rgba(10,14,26,0.7); border: 1px solid rgba(255,255,255,0.05); padding: 0.3rem 1rem; border-radius: 20px; pointer-events: none; white-space: nowrap; }
    .stats { position: fixed; top: 0.75rem; right: 1rem; z-index: 100; display: flex; gap: 0.5rem; }
    .stats span { font-family: monospace; font-size: 0.6rem; color: rgba(230,238,248,0.4); background: rgba(0,116,255,0.08); border: 1px solid rgba(0,116,255,0.12); padding: 0.2rem 0.5rem; border-radius: 4px; }
  </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="c"></canvas>
  <div class="stats"><span id="statCount">0</span><span id="statFps">0 FPS</span></div>
  <div class="status" id="statusBadge">Initializing...</div>
  <script>
  (function(){
    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var statusEl = document.getElementById('statusBadge');
    var countEl = document.getElementById('statCount');
    var fpsEl = document.getElementById('statFps');

    var W, H, particles = [], running = true;
    var count = 5000, time = 0, fps = 0, fpsAcc = 0, fpsCnt = 0;
    var cx = 0.5, cy = 0.5, lastTick;

    function resize() {
      var w = canvas.clientWidth || window.innerWidth || 800;
      var h = canvas.clientHeight || window.innerHeight || 600;
      var dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = w; H = h;
    }

    function spawn(i) {
      var h1 = (i * 7) % 97 / 97, h2 = (i * 13) % 101 / 101, h3 = (i * 17) % 89 / 89;
      var cx2 = W/2, cy2 = H/2, s = Math.min(W, H);
      var theta = h1 * 6.2832, phi = Math.acos(2 * h2 - 1), r = s * 0.15 * (1 + h3);
      return {
        x: cx2 + Math.sin(phi) * Math.cos(theta) * r,
        y: cy2 + Math.sin(phi) * Math.sin(theta) * r,
        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
        life: 3 + Math.random() * 5, maxLife: 3 + Math.random() * 5,
        size: 2 + Math.random() * 4,
        r: 0.3 + Math.random() * 0.7, g: 0.3 + Math.random() * 0.7, b: 0.6 + Math.random() * 0.4,
      };
    }

    function initParticles() {
      particles = new Array(count);
      for (var i = 0; i < count; i++) particles[i] = spawn(i);
    }

    function update(dt) {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.life -= dt * 0.3;
        if (p.life <= 0) { particles[i] = spawn(i); continue; }
        var dx = cx - p.x, dy = cy - p.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        p.vx += (dx / dist) * 15 * dt;
        p.vy += (dy / dist) * 15 * dt;
        p.vx += Math.sin(p.y * 0.02 + time * 1.3) * 8 * dt;
        p.vy += Math.cos(p.x * 0.017 + time * 1.1) * 8 * dt;
        p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx; p.y += p.vy;
      }
    }

    function draw() {
      ctx.fillStyle = '#03050A';
      ctx.fillRect(0, 0, W, H);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var lr = p.life / p.maxLife;
        if (lr <= 0) continue;
        var fade = (lr < 0.15 ? lr / 0.15 : 1) * (lr > 0.75 ? (1 - lr) / 0.25 : 1);
        if (fade < 0.01) continue;
        var alpha = fade * 0.6;
        if (p.size < 0.5) continue;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, 6.2832);
        ctx.fillStyle = 'rgba(' + ((p.r * 155 + 100) | 0) + ',' + ((p.g * 80 + 130) | 0) + ',255,' + alpha + ')';
        ctx.fill();
      }
    }

    function frame() {
      if (!running) return;
      try {
        var now = performance.now();
        var dt = Math.min((now - lastTick) / 1000, 0.05);
        lastTick = now;
        time += dt;
        fpsAcc += dt; fpsCnt++;
        if (fpsAcc >= 1) { fps = Math.round(fpsCnt / fpsAcc); fpsAcc = 0; fpsCnt = 0; }
        update(dt);
        draw();
        countEl.textContent = (count >= 1000 ? (count / 1000).toFixed(1) + 'K' : count);
        fpsEl.textContent = fps + ' FPS';
      } catch(e) {
        statusEl.textContent = 'Error: ' + e.message;
        running = false;
      }
      requestAnimationFrame(frame);
    }

    resize();
    initParticles();
    statusEl.textContent = count + ' particles running';
    lastTick = performance.now();
    frame();

    window.addEventListener('resize', resize);
    canvas.addEventListener('mousemove', function(e) { cx = e.clientX; cy = e.clientY; });
    canvas.addEventListener('touchmove', function(e) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }, { passive: true });
  })();
  </script>
</body>
</html>
