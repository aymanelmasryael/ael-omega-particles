<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050A"/>
      <stop offset="50%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0074FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0074FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0074FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="315" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Particle field visualization -->
  <g opacity="0.4">
    <circle cx="200" cy="180" r="2" fill="#0074FF" opacity="0.8"/>
    <circle cx="350" cy="150" r="1.5" fill="#00E5FF" opacity="0.6"/>
    <circle cx="500" cy="200" r="1" fill="#0074FF" opacity="0.5"/>
    <circle cx="650" cy="170" r="2.5" fill="#00E5FF" opacity="0.7"/>
    <circle cx="800" cy="210" r="1.5" fill="#0074FF" opacity="0.6"/>
    <circle cx="950" cy="160" r="2" fill="#00E5FF" opacity="0.5"/>
    <circle cx="300" cy="350" r="1.5" fill="#0074FF" opacity="0.5"/>
    <circle cx="450" cy="400" r="2" fill="#00E5FF" opacity="0.6"/>
    <circle cx="600" cy="380" r="1" fill="#0074FF" opacity="0.7"/>
    <circle cx="750" cy="420" r="2" fill="#00E5FF" opacity="0.5"/>
    <circle cx="900" cy="360" r="1.5" fill="#0074FF" opacity="0.6"/>
    <circle cx="150" cy="450" r="1" fill="#00E5FF" opacity="0.4"/>
    <circle cx="1050" cy="450" r="1.5" fill="#0074FF" opacity="0.5"/>
    <circle cx="400" cy="280" r="3" fill="#0074FF" opacity="0.3"/>
    <circle cx="700" cy="300" r="2.5" fill="#00E5FF" opacity="0.3"/>
  </g>

  <!-- Particle trails -->
  <g opacity="0.15">
    <line x1="200" y1="180" x2="215" y2="175" stroke="#0074FF" stroke-width="1"/>
    <line x1="350" y1="150" x2="362" y2="145" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="650" y1="170" x2="668" y2="162" stroke="#00E5FF" stroke-width="1"/>
    <line x1="800" y1="210" x2="815" y2="203" stroke="#0074FF" stroke-width="0.8"/>
    <line x1="450" y1="400" x2="465" y2="392" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="750" y1="420" x2="766" y2="412" stroke="#0074FF" stroke-width="0.8"/>
  </g>

  <!-- Central content area -->
  <rect x="200" y="140" width="800" height="350" rx="20" fill="rgba(10,14,26,0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Logo -->
  <text x="600" y="210" font-family="'Inter',system-ui,sans-serif" font-size="64" font-weight="800" text-anchor="middle" fill="url(#accent)">&#937;</text>

  <!-- Title -->
  <text x="600" y="270" font-family="'Inter',system-ui,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#E6EEF8">Omega Particles</text>

  <!-- Subtitle -->
  <text x="600" y="300" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" fill="rgba(230,238,248,0.4)">WEBGPU PARTICLE ENGINE v4</text>

  <!-- Feature badges -->
  <g transform="translate(600, 350)">
    <rect x="-140" y="-14" width="90" height="28" rx="14" fill="rgba(0,116,255,0.12)" stroke="rgba(0,116,255,0.2)" stroke-width="1"/>
    <text x="-95" y="5" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0074FF" text-anchor="middle">100K Particles</text>

    <rect x="-40" y="-14" width="80" height="28" rx="14" fill="rgba(0,229,255,0.12)" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
    <text x="0" y="5" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00E5FF" text-anchor="middle">144 FPS</text>

    <rect x="50" y="-14" width="90" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="95" y="5" font-family="'JetBrains Mono',monospace" font-size="11" fill="rgba(230,238,248,0.5)" text-anchor="middle">3D Orbit</text>
  </g>

  <!-- Control panel mockup -->
  <g transform="translate(880, 180)" opacity="0.3">
    <rect x="0" y="0" width="100" height="270" rx="8" fill="rgba(10,14,26,0.9)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    <rect x="10" y="10" width="80" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <rect x="10" y="26" width="80" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="10" y="40" width="80" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="10" y="54" width="80" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="10" y="68" width="80" height="4" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="10" y="82" width="80" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="10" y="105" width="80" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>
    <circle cx="25" cy="130" r="8" fill="#0074FF" opacity="0.3"/>
    <circle cx="50" cy="130" r="8" fill="#00E5FF" opacity="0.3"/>
    <circle cx="75" cy="130" r="8" fill="#FF4500" opacity="0.3"/>
    <rect x="10" y="150" width="35" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="50" y="150" width="35" height="20" rx="4" fill="rgba(255,255,255,0.06)"/>
    <rect x="10" y="180" width="80" height="20" rx="4" fill="rgba(0,116,255,0.15)"/>
  </g>

  <!-- Stats -->
  <text x="600" y="410" font-family="'JetBrains Mono',monospace" font-size="12" fill="rgba(230,238,248,0.3)" text-anchor="middle">GPU Compute · Force Fields · Audio Reactive · 6 Color Themes</text>

  <!-- Footer -->
  <text x="600" y="590" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="rgba(230,238,248,0.3)" text-anchor="middle">AEL Digital Studio — Ayman Elmasry</text>
  <text x="600" y="608" font-family="'JetBrains Mono',monospace" font-size="10" fill="rgba(230,238,248,0.15)" text-anchor="middle">ael-omega-particles</text>
</svg>
